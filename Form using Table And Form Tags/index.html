<!DOCTYPE html>
<html lang="en">
<head>
    <title>Form</title>
</head>
<body>
    <form action="welcom.html">
        <fieldset>
            <legend align="center">Job Appilcation</legend>

            <table>
                <tr>
                    <label>First Name</label>
                    <input type="text">
                </tr>
                <tr>
                    <label>Last Name</label>
                    <input type="text">
                </tr>
                <tr>
                    <td>
                        <label>Contact</label>
                            <input type="tel" name="Contact"
                            placeholder="03*********" maxlength="11">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Enter Your Skills</label>
                        <input type type="text">
                    </td>
                </tr>
                <tr>
                    <td>
                    <label>
                        Chose Ur Age
                        <select>
                            <option value="" selected disabled>Chose ur Age</option>
                            <option>10-15</option>
                            <option>15-20</option>
                            <option>20-25</option>
                            <option>25-30</option>
                        </select>
                    </label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>
                            Chose Ur Hobbies
                            <input type="checkbox" name="hobbies" id="" value="Football">Football
                            <input type="checkbox" name="hobbies" id="" value="Swimming">Swimming
                            <input type="checkbox" name="hobbies" id="" value="Reading">Reading
                            <input type="checkbox" name="hobbies" id="" value="Art">Art
                        </label>
                    </td>
                </tr>
                <tr>
                    <label>Email</label>
                    <input type="email">
                </tr>
                <tr>
                    <td>
                        <label>
                            Work Status
                            <input type="checkbox" name="Time" id="" value="Full Time">Full Time
                            <input type="checkbox" name="Time" id="" value="Part Time">Part Time
                            <input type="checkbox" name="Time" id="" value="Per Dim">Per Dim
                            <input type="checkbox" name="Time" id="" value="Other">Other
                        </label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>
                            Experience
                            <input type="text">
                        </label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Salary</label>
                        <select>
                            <option selected disabled>Us Dolllars</option>
                            <option>100-150$</option>
                            <option>150-200$</option>
                            <option>200-250$</option>
                            <option>250-300$</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>
                        <br>
                        <button type="submit">Submit</button>
                        <br>
                    </td>
                </tr>
            </table>
        </fieldset>
    </form>
</body>
</html>
